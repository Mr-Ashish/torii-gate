<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Luffy · H-cinematic">

  <defs>
    <linearGradient id="splitH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="55%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1c0a0e"/>
    </linearGradient>
    <linearGradient id="slabH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B2C"/>
      <stop offset="100%" stop-color="#C41E3A"/>
    </linearGradient>
    <linearGradient id="slabH2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#8a6a20"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#splitH)"/>
  <!-- stacked 3D slabs (right) -->
  <g transform="translate(780,40)">
    <g transform="skewY(-12)">
      <rect x="40" y="40" width="280" height="48" rx="8" fill="url(#slabH)" opacity="0.95"/>
      <rect x="55" y="100" width="280" height="48" rx="8" fill="#111827" stroke="#FF6B2C" stroke-opacity="0.4"/>
      <rect x="70" y="160" width="280" height="48" rx="8" fill="url(#slabH2)" opacity="0.9"/>
      <rect x="85" y="220" width="280" height="48" rx="8" fill="#111827" stroke="#FFD166" stroke-opacity="0.35"/>
    </g>
  </g>
  <text x="64" y="115" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="600" fill="#FF6B2C" letter-spacing="4">AGENTIC CI</text>
  <text x="64" y="175" font-family="ui-sans-serif,system-ui,sans-serif" font-size="58" font-weight="800" fill="#FFFFFF">Luffy</text>
  <text x="64" y="225" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" fill="#FFD166">Review control plane with memory + traces</text>
  <text x="64" y="270" font-family="ui-monospace,monospace" font-size="14" fill="#9CA3AF">preload → assemble → hermes → normalize → hub</text>

</svg>
