# Offline reliability smoke (no OpenRouter, no live PR).
# Keeps product pack + gate + loops green on every push/PR to main.
name: Torii smoke offline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torii-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Offline smoke + ops surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Product offline smoke
        env:
          # Full product smoke without heavy tool-evolve mine (still runs dual-gate skips)
          TORII_SMOKE_TOOL_EVOLVE: "0"
        run: bash scripts/smoke-torii-gate.sh

      - name: Ops + enterprise + commercial fixtures
        run: |
          python3 scripts/ops_dashboard.py fixture
          python3 scripts/enterprise_surface.py fixture
          python3 scripts/commercial_scorecard.py fixture

      - name: Focused pytest (gate + commercial surfaces)
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q \
            tests/test_smoke_torii_gate.py \
            tests/test_torii_gate_status.py \
            tests/test_tool_turns_gate.py \
            tests/test_ops_dashboard.py \
            tests/test_install_ux.py \
            tests/test_golden_path_metrics.py \
            tests/test_buyer_narrative_check.py \
            tests/test_public_eval.py \
            tests/test_enterprise_surface.py \
            tests/test_commercial_scorecard.py