# Deploy Torii Gate buyer landing to GitHub Pages (DEPLOYED_LANDING).
# Enable: Settings → Pages → Source = GitHub Actions
name: Pages · landing

on:
  push:
    branches: [main]
    paths:
      - "docs/brand/landing.html"
      - "docs/brand/site/**"
      - "scripts/build_landing_site.py"
      - ".github/workflows/pages-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-landing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build site from landing.html
        run: python3 scripts/build_landing_site.py build --json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/brand/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
