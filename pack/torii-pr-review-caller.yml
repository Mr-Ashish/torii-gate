# Torii — hub-managed thin caller (F10)
#
# Install with: ./scripts/install-torii.sh --caller /path/to/target-repo
# No agent/ or scripts/ copy required; runtime is checked out from the hub on each run.
#
# Required secret on this repo: OPENROUTER_API_KEY
# Optional: TORII_HUB_TOKEN, vars TORII_MODEL / TORII_HERMES_COMMIT / TORII_COOLDOWN_SECONDS / TORII_RUNNER_IMAGE / TORII_COMMIT_STATUS
# Trigger: @torii review this pr

name: Torii Gate

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  statuses: write  # F22 commit status context torii/review

concurrency:
  group: torii-${{ github.repository }}-${{ github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  torii-review:
    name: Torii Gate review
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        (
          contains(github.event.comment.body, '@torii review this pr') ||
          contains(github.event.comment.body, '@torii review')
        )
      )
    uses: Mr-Ashish/torii-gate/.github/workflows/torii-review-reusable.yml@main
    secrets: inherit
    with:
      torii_repository: Mr-Ashish/torii-gate
      torii_ref: main
